мой диспетчера: Программа диспетчера → Контроллер насосов (из «Общая сеть водоканала» в «Сеть насосной станции»): Modbus TCP 502, двунаправленное правило.\" style=\"text;html=1;align=left;verticalAlign=middle;whiteSpace=wrap;fontColor=#FFFFFF;fontSize=11;fontFamily=Open Sans;fontSource=https%3A%2F%2Ffonts.googleapis.com%2Fcss%3Ffamily%3DOpen%2BSans;\" vertex=\"1\" parent=\"1\"><mxGeometry x=\"62\" y=\"470\" width=\"1348\" height=\"26\" as=\"geometry\"/></mxCell><mxCell id=\"lg_m2\" value=\"\" style=\"rounded=1;arcSize=30;fillColor=#35C4AF;strokeColor=none;\" vertex=\"1\" parent=\"1\"><mxGeometry x=\"40\" y=\"503\" width=\"12\" height=\"12\" as=\"geometry\"/></mxCell><mxCell id=\"lg_l2\" value=\"2. Журналы событий на сервер мониторинга: Компьютер оператора → Сервер мониторинга (из «Сеть насосной станции» в «Общая сеть водоканала»): UDP 514, однонаправленное правило.\" style=\"text;html=1;align=left;verticalAlign=middle;whiteSpace=wrap;fontColor=#FFFFFF;fontSize=11;fontFamily=Open Sans;fontSource=https%3A%2F%2Ffonts.googleapis.com%2Fcss%3Ffamily%3DOpen%2BSans;\" vertex=\"1\" parent=\"1\"><mxGeometry x=\"62\" y=\"496\" width=\"1348\" height=\"26\" as=\"geometry\"/></mxCell><mxCell id=\"lg_m3\" value=\"\" style=\"rounded=1;arcSize=30;fillColor=#FFAB4D;strokeColor=none;\" vertex=\"1\" parent=\"1\"><mxGeometry x=\"40\" y=\"529\" width=\"12\" height=\"12\" as=\"geometry\"/></mxCell><mxCell id=\"lg_l3\" value=\"3. Синхронизация времени: Сервер времени → Сервер времени станции (из «Общая сеть водоканала» в «Сеть насосной станции»): UDP 123, однонаправленное правило.\" style=\"text;html=1;align=left;verticalAlign=middle;whiteSpace=wrap;fontColor=#FFFFFF;fontSize=11;fontFamily=Open Sans;fontSource=https%3A%2F%2Ffonts.googleapis.com%2Fcss%3Ffamily%3DOpen%2BSans;\" vertex=\"1\" parent=\"1\"><mxGeometry x=\"62\" y=\"522\" width=\"1348\" height=\"26\" as=\"geometry\"/></mxCell><mxCell id=\"lg_n0\" value=\"Размещение: на границе сегмента «Сеть насосной станции» со стороны сети «Общая сеть водоканала» стоит межсетевой экран (рекомендуем, даже если его нет в описании); «Синоникс» — внутри «Сеть насосной станции» сразу за ним. Узел А обращён к сети «Общая сеть водоканала», Узел В — к системам «Сеть насосной станции». Прямого соединения сетей в обход «Синоникса» нет.\" style=\"text;html=1;align=left;verticalAlign=middle;whiteSpace=wrap;fontColor=#B9C5CD;fontSize=11;fontFamily=Open Sans;fontSource=https%3A%2F%2Ffonts.googleapis.com%2Fcss%3Ffamily%3DOpen%2BSans;\" vertex=\"1\" parent=\"1\"><mxGeometry x=\"62\" y=\"548\" width=\"1348\" height=\"40\" as=\"geometry\"/></mxCell><mxCell id=\"p1\" value=\"1 · Modbus TCP 502\" style=\"rounded=1;arcSize=50;fillColor=#354552;strokeColor=none;html=1;fontColor=#FFFFFF;fontSize=10;fontStyle=1;fontFamily=Open Sans;fontSource=https%3A%2F%2Ffonts.googleapis.com%2Fcss%3Ffamily%3DOpen%2BSans;\" vertex=\"1\" parent=\"1\"><mxGeometry x=\"332\" y=\"169\" width=\"129\" height=\"18\" as=\"geometry\"/></mxCell><mxCell id=\"p2\" value=\"2 · UDP 514\" style=\"rounded=1;arcSize=50;fillColor=#354552;strokeColor=none;html=1;fontColor=#FFFFFF;fontSize=10;fontStyle=1;fontFamily=Open Sans;fontSource=https%3A%2F%2Ffonts.googleapis.com%2Fcss%3Ffamily%3DOpen%2BSans;\" vertex=\"1\" parent=\"1\"><mxGeometry x=\"332\" y=\"256\" width=\"84\" height=\"18\" as=\"geometry\"/></mxCell><mxCell id=\"p3\" value=\"3 · NTP, UDP 123\" style=\"rounded=1;arcSize=50;fillColor=#354552;strokeColor=none;html=1;fontColor=#FFFFFF;fontSize=10;fontStyle=1;fontFamily=Open Sans;fontSource=https%3A%2F%2Ffonts.googleapis.com%2Fcss%3Ffamily%3DOpen%2BSans;\" vertex=\"1\" parent=\"1\"><mxGeometry x=\"332\" y=\"343\" width=\"116\" height=\"18\" as=\"geometry\"/></mxCell><mxCell id=\"p4\" value=\"1 · Modbus TCP 502\" style=\"rounded=1;arcSize=50;fillColor=#354552;strokeColor=none;html=1;fontColor=#FFFFFF;fontSize=10;fontStyle=1;fontFamily=Open Sans;fontSource=https%3A%2F%2Ffonts.googleapis.com%2Fcss%3Ffamily%3DOpen%2BSans;\" vertex=\"1\" parent=\"1\"><mxGeometry x
